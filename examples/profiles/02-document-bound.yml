# Mapping v2 with content-bound group selection and private identity inputs.
schema: shieldfont/v1
project:
  id: example-document-bound
  version: 2.0.0
  outputDir: ../../dist/examples/document-bound
  reproducible: true
  sourceDateEpoch: 0
source:
  path: ../../.fonts/Source.ttf
font:
  family: ShieldFont Document Example
  outputFormats: [ttf, woff2]
layout:
  gsubOptimization: auto
scopes:
  - id: default
    dictionaries:
      - ../mappings/document-bound.json
mapping:
  mode: directed
protection:
  profile: document-bound
  mappingContract: shieldfont.mapping.v2
  seed: demo-private-build-seed
  documentNonce: demo-document-2026-08-06
  tenantId: demo-private-tenant
  inventory:
    - ../content/article.txt
  reserveAliases: 0
  reserve: []
  scanPublicArtifacts: true
