[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldfont-toolchain"
version = "0.1.0.dev0"
description = "Build multilingual TrueType ShieldFont fonts, features, codecs, and verification artifacts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "brotli>=1.1",
  "fonttools[woff]>=4.59",
  "pydantic>=2.11",
  "PyYAML>=6.0",
  "typer>=0.16",
  "uharfbuzz>=0.51",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.136",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-PyYAML>=6.0",
]
portable = [
  "pyinstaller>=6.14",
]

[project.scripts]
shieldfont = "shieldfont.presentation.cli.main:main"
shieldfont-generate = "shieldfont.presentation.cli.generate_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shieldfont = ["config/schemas/*.json", "presentation/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shieldfont"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["deps/shieldfont"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
